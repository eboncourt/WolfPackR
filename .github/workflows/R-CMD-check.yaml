name: R-CMD-check
on: [push, pull_request]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_VIGNETTES_: false

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      # Installer les dépendances système sur Ubuntu
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libssl-dev libcurl4-openssl-dev

      # Installer les dépendances système sur macOS
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install udunits gdal geos proj libgit2

      # Installer les dépendances système sur Windows
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install rtools -y
        shell: cmd

      # Installer les dépendances R
      - name: Install R dependencies
        run: |
          install.packages(c("remotes", "rcmdcheck", "testthat", "covr"))
          remotes::install_deps(dependencies = TRUE)
          remotes::install_local(upgrade = "never")
        shell: Rscript {0}

      # Exécuter R CMD check
      - name: Run R CMD check
        run: |
          options(crayon.enabled = FALSE)
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--no-build-vignettes", "--as-cran"),
            error_on = "error",
            check_dir = "check"
          )
        shell: Rscript {0}
        env:
          _R_CHECK_VIGNETTES_: false
          _R_CHECK_FORCE_SUGGESTS_: false
